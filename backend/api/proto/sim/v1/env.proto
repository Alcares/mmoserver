syntax = "proto3";

package sim.v1;
option go_package = "github.com/alcares/mmoserver/backend/gen/go/sim/v1;simv1";


// Env is the batched training environment making network round trip cost amortized
service Env {
  rpc Reset(ResetRequest) returns (ResetResponse);
  rpc Step(StepRequest) returns (StepResponse);
}

message ResetRequest {
  // One seed per env; its length sets the vector width for the Steps that follow.
  repeated int64 seeds = 1;
}

message ResetResponse {
  repeated float observations = 1;
  // bot.ObsSize, so Python can assert the layout its policy was trained against.
  uint32 obs_size = 2;
}

message StepRequest {
  // One action per env, in seed order.
  repeated int32 actions = 1;
}

message StepResponse {
  // An env that finished is reset in place, so this holds the first observation of its next episode.
  repeated float observations = 1;
  repeated float rewards = 2;
  repeated bool terminated = 3;
  repeated bool truncated = 4;
  // The observation each finished env ended on, zero elsewhere. PPO bootstraps a truncated
  // episode's value from it.
  repeated float final_observations = 5;
}