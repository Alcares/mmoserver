syntax = "proto3";

package bot.v1;
option go_package = "github.com/alcares/mmoserver/backend/gen/go/bot/v1;botv1";

// Policy is a network exported from training: what a forward pass needs and nothing else.
// The Stable-Baselines3 checkpoint it comes from also carries the critic and the optimizer's
// state, which are several times larger and are only used to keep training.
//
// This schema is the single source of truth for policy.pb. Python serialises it and Go
// unmarshals it, both through generated code.
message Policy {
  // Checked against bot.ObsSize and bot.ActionCount when the policy loads. Changing the
  // observation layout invalidates every trained policy, so a stale file has to be an error
  // rather than a network quietly reading the wrong five numbers.
  uint32 obs_size = 1;
  uint32 action_count = 2;

  // Applied after every layer except the last, whose outputs are logits. Argmax over logits
  // equals argmax over probabilities, so inference never needs the softmax.
  Activation activation = 3;

  // In order, input first. The last layer's out_features is action_count.
  repeated Layer layers = 4;
}

enum Activation {
  ACTIVATION_UNSPECIFIED = 0;
  ACTIVATION_TANH = 1;
}

message Layer {
  uint32 in_features = 1;
  uint32 out_features = 2;

  // Row-major: out_features rows of in_features each, which is torch.nn.Linear's [out, in]
  // layout carried over unchanged.
  repeated float weight = 3;
  repeated float bias = 4;
}
