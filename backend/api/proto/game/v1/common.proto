syntax = "proto3";

package game.v1;
option go_package = "github.com/alcares/mmoserver/backend/gen/go/game/v1;gamev1";
option csharp_namespace = "Game.V1";

enum PowerUpType {
  POWER_UP_TYPE_UNSPECIFIED = 0;
  POWER_UP_TYPE_FULL_VISION = 1;
}

enum RandomCommodityEventType {
  RANDOM_COMMODITY_EVENT_UNSPECIFIED = 0;
  RANDOM_COMMODITY_EVENT_SANCTIONED = 1;       // Exchange will take a cut from trading
  RANDOM_COMMODITY_EVENT_CLOSED = 2;           // Trading will be closed for a moment
  RANDOM_COMMODITY_EVENT_SUPPLY_FLOOD = 3;     // Prices will go down
  RANDOM_COMMODITY_EVENT_SUPPLY_SHORTAGE = 4;  // Prices will go up
}

enum CommodityType {
  COMMODITY_UNSPECIFIED = 0;
  COMMODITY_WHEAT = 1;
  COMMODITY_COFFEE = 2;
  COMMODITY_LITHIUM = 3;
  COMMODITY_GOLD = 4;
  COMMODITY_OIL = 5;
  COMMODITY_SILVER = 6;
}

enum OrderIntent {
  INTENT_UNSPECIFIED = 0;
  INTENT_BUY  = 1; // Buy a whole number of units
  INTENT_SELL = 2; // Sell a whole number of units
}

// Why the server refused a trade, carried in TradeReceipt
enum TradeRejection {
  TRADE_REJECTION_UNSPECIFIED        = 0; // Not rejected: the trade executed
  TRADE_REJECTION_NOT_AT_STATION     = 1; // No trading station within TradeRange
  TRADE_REJECTION_INVALID_ORDER      = 2; // Unknown intent or zero units
  TRADE_REJECTION_PRICE_MOVED        = 3; // The price moved against the price the client sent
  TRADE_REJECTION_INSUFFICIENT_CASH  = 4; // Can't afford units * price
  TRADE_REJECTION_INSUFFICIENT_UNITS = 5; // Holds fewer units than the order sells
  TRADE_REJECTION_POOL_EXHAUSTED     = 6; // The pool can't fill it: buying its last unit, or units worth under a cent
  TRADE_REJECTION_GAME_NOT_RUNNING   = 7;
  TRADE_REJECTION_STATION_CLOSED     = 8;
}

enum JoinRejection {
  JOIN_REJECTION_UNSPECIFIED = 0;
  JOIN_REJECTION_GAME_NOT_FOUND = 1;
  JOIN_REJECTION_GAME_FULL = 2;
  JOIN_REJECTION_GAME_IN_PROGRESS = 3;
  JOIN_REJECTION_SERVER_FULL      = 4; // This server already hosts its maximum number of games
}

enum AccountCreateRejection {
  ACCOUNT_CREATE_REJECTION_UNSPECIFIED            = 0; // Not rejected: the account was created
  ACCOUNT_CREATE_REJECTION_USERNAME_TAKEN         = 1;
  ACCOUNT_CREATE_REJECTION_USERNAME_INVALID       = 2; // Wrong length or characters
  ACCOUNT_CREATE_REJECTION_PASSWORD_TOO_SHORT     = 3;
  ACCOUNT_CREATE_REJECTION_PASSWORD_TOO_LONG      = 4; // bcrypt's 72-byte limit
  ACCOUNT_CREATE_REJECTION_PASSWORD_TOO_COMMON    = 5;
  ACCOUNT_CREATE_REJECTION_PASSWORD_MISSING_NUMBERS            = 6;
  ACCOUNT_CREATE_REJECTION_PASSWORD_MISSING_SPECIAL_CHARACTERS = 7;
  ACCOUNT_CREATE_REJECTION_SERVER_ERROR           = 8; // Not the player's fault; try again later
}

enum LoginRejection {
  LOGIN_REJECTION_UNSPECIFIED = 0;
  LOGIN_REJECTION_INVALID_CREDENTIALS = 1;
  LOGIN_REJECTION_SERVER_ERROR = 2; // Not the player's fault; try again later
}

enum GamePhase {
  GAME_PHASE_UNSPECIFIED = 0;
  GAME_PHASE_WAITING     = 1;  // fewer than MinPlayers connected
  GAME_PHASE_COUNTDOWN   = 2;  // threshold reached, about to start
  GAME_PHASE_RUNNING     = 3;  // the 5-minute round
  GAME_PHASE_FINISHED    = 4;  // GameOver sent
}
