syntax = "proto3";

package game.v1;
option go_package = "github.com/alcares/mmoserver/backend/gen/go/game/v1;gamev1";
option csharp_namespace = "Game.V1";

import "game/v1/common.proto";
import "game/v1/spectator.proto";

// Sent whenever a key is pressed
message MovementCommand {
  float vx = 1;
  float vy = 2;
}

// TODO: add create game config params
message CreateGame {}

message JoinGame {
  string id = 1;
}

message SpawnBot {
  string name = 1;
}

// Sent when the player presses buy/sell at a station. The server trades
// against the station the player is standing at, for the whole order or nothing.
message TradeRequest {
  uint32 sequence_id = 1;         // Client sequence counter, echoed in TradeReceipt
  OrderIntent intent = 2;
  uint32 units = 3;               // Whole units to buy or sell, at least 1
  // Per-unit price (cents) the client saw for this order size (OrderQuote). A buy is rejected
  // if the price rose above it, a sell if it fell below it; a better price fills.
  uint64 price_cents = 4;
}

// Client -> Server: Discriminated wrapper for all client commands.
message ClientMessage {
  oneof cmd {
    MovementCommand input = 1;
    TradeRequest trade = 2;
    CreateGame create_game = 3;
    JoinGame join_game = 4;
    SpawnBot spawn_bot = 5;

    // Spectator only
    PlaybackSpeed set_playback_speed = 6;
  }
}