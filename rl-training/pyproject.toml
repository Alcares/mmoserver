[project]
name = "rl-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcin Augustynow", email = "marcin.augustynow@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
]

[project.scripts]
rl-training = "rl_training:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["rl_training", "sim"]
