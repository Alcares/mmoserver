<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid / Chessboard MMO</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/protobufjs/7.2.6/protobuf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #f8fafc;
      font-family: monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #status {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      z-index: 10;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
<div id="status">Status: Connecting...</div>
<canvas id="gameCanvas"></canvas>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const statusDiv = document.getElementById("status");

  // Dynamic Fullscreen Canvas Resize
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // Grid & Vision Configuration
  const TILE_SIZE = 22;
  const WORLD_TILES = 500;
  const VISION_RADIUS_TILES = 10; // Aligned with server's QueryRadius (20 tiles)

  let players = [];
  let myPlayerId = null;
  let InputCommand = null;
  let WorldSnapshot = null;
  let socket = null;

  protobuf.load("game.proto", (err, root) => {
    if (err) {
      statusDiv.innerText = "Error loading proto: " + err.message;
      return;
    }

    InputCommand = root.lookupType("game.v1.InputCommand");
    WorldSnapshot = root.lookupType("game.v1.WorldSnapshot");
    initNetwork();
  });

  function initNetwork() {
    const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    socket = new WebSocket(`${proto}//${window.location.host}/ws`);
    socket.binaryType = "arraybuffer";

    socket.onopen = () => {
      statusDiv.innerText = "Status: Connected. Tracking local player.";
    };

    socket.onclose = () => {
      statusDiv.innerText = "Status: Disconnected. Server stopped.";
    };

    socket.onmessage = (event) => {
      try {
        const uint8Array = new Uint8Array(event.data);
        const decoded = WorldSnapshot.decode(uint8Array);
        const message = WorldSnapshot.toObject(decoded, { defaults: true });
        players = message.players || [];

        if (myPlayerId === null && players.length > 0) {
          myPlayerId = players[0].id;
        }
      } catch (e) {
        console.error("Failed to decode snapshot:", e);
      }
    };
  }

  // Capture key inputs
  window.addEventListener("keydown", (e) => {
    if (!socket || socket.readyState !== WebSocket.OPEN || !InputCommand) return;

    let dx = 0;
    let dy = 0;

    switch (e.key) {
      case "ArrowUp":
      case "w":
      case "W":
        dy = -1; break;
      case "ArrowDown":
      case "s":
      case "S":
        dy = 1; break;
      case "ArrowLeft":
      case "a":
      case "A":
        dx = -1; break;
      case "ArrowRight":
      case "d":
      case "D":
        dx = 1; break;
      default:
        return;
    }

    e.preventDefault();

    const payload = InputCommand.encode({ dx, dy }).finish();
    socket.send(payload);
  });

  // Render loop
  function render() {
    // 1. Reset transform & blank screen with dark void
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#020617";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const me = players.find(p => p.id === myPlayerId) || players[0];

    if (me) {
      const playerPixelX = (me.x * TILE_SIZE) + (TILE_SIZE / 2);
      const playerPixelY = (me.y * TILE_SIZE) + (TILE_SIZE / 2);

      const cameraX = Math.floor(playerPixelX - (canvas.width / 2));
      const cameraY = Math.floor(playerPixelY - (canvas.height / 2));

      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      // View frustum culling
      const startCol = Math.max(0, Math.floor(cameraX / TILE_SIZE));
      const endCol = Math.min(WORLD_TILES, Math.ceil((cameraX + canvas.width) / TILE_SIZE));
      const startRow = Math.max(0, Math.floor(cameraY / TILE_SIZE));
      const endRow = Math.min(WORLD_TILES, Math.ceil((cameraY + canvas.height) / TILE_SIZE));

      // 2. Draw Tiles
      for (let row = startRow; row < endRow; row++) {
        for (let col = startCol; col < endCol; col++) {
          const isEven = (row + col) % 2 === 0;
          ctx.fillStyle = isEven ? "#1e293b" : "#0f172a";
          ctx.fillRect(col * TILE_SIZE, row * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
      }

      // 3. Draw Grid Lines
      ctx.strokeStyle = "#162032";
      ctx.lineWidth = 1;
      for (let x = startCol * TILE_SIZE; x <= endCol * TILE_SIZE; x += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, startRow * TILE_SIZE);
        ctx.lineTo(x, endRow * TILE_SIZE);
        ctx.stroke();
      }
      for (let y = startRow * TILE_SIZE; y <= endRow * TILE_SIZE; y += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(startCol * TILE_SIZE, y);
        ctx.lineTo(endCol * TILE_SIZE, y);
        ctx.stroke();
      }

      // 4. Draw Players
      for (const p of players) {
        const px = (p.x * TILE_SIZE) + (TILE_SIZE / 2);
        const py = (p.y * TILE_SIZE) + (TILE_SIZE / 2);
        const isMe = p.id === myPlayerId;

        ctx.beginPath();
        ctx.arc(px, py, TILE_SIZE * 0.38, 0, Math.PI * 2);
        ctx.fillStyle = isMe ? "#22c55e" : "#38bdf8";
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#f8fafc";
        ctx.stroke();

        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 9px monospace";
        ctx.textAlign = "center";
        const label = isMe ? "You" : (p.name || `P${p.id}`);
        ctx.fillText(label, px, py - (TILE_SIZE * 0.5));
      }

      // 5. Fog of War Overlay
      // Uses radial gradient centered on player: transparent at center -> solid black beyond radius
      const innerFog = (VISION_RADIUS_TILES - 5) * TILE_SIZE;
      const outerFog = VISION_RADIUS_TILES * TILE_SIZE;

      const fogGradient = ctx.createRadialGradient(
              playerPixelX, playerPixelY, Math.max(0, innerFog),
              playerPixelX, playerPixelY, outerFog
      );
      fogGradient.addColorStop(0, "rgba(2, 6, 23, 0)");
      fogGradient.addColorStop(0.7, "rgba(2, 6, 23, 0.4)");
      fogGradient.addColorStop(1, "rgba(2, 6, 23, 1)");

      ctx.fillStyle = fogGradient;
      ctx.fillRect(cameraX, cameraY, canvas.width, canvas.height);

      ctx.restore();

      // 6. UI HUD Overlay
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fillRect(16, 16, 160, 30);
      ctx.strokeStyle = "#475569";
      ctx.strokeRect(16, 16, 160, 30);
      ctx.fillStyle = "#38bdf8";
      ctx.font = "12px monospace";
      ctx.textAlign = "left";
      ctx.fillText(`Pos: [${me.x}, ${me.y}]`, 26, 35);
    }

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
</script>
</body>
</html>
