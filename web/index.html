<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid / Chessboard MMO</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/protobufjs/7.2.6/protobuf.min.js"></script>
  <script src="crewmate.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #status {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      z-index: 10;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<div id="status">Status: Connecting...</div>
<canvas id="gameCanvas"></canvas>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const statusDiv = document.getElementById("status");

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // Server physics coordinate unit
  const TILE_SIZE = 22;
  const WORLD_TILES = 500;

  // 4x surface area = 2x linear size (44px x 44px) -> 4x fewer tiles total
  const VISUAL_TILE_SIZE = TILE_SIZE * 2;
  const WORLD_PIXEL_WIDTH = WORLD_TILES * TILE_SIZE;

  let players = [];
  let stations = [];
  let myPlayerId = null;
  let myBalance = null;
  let myCommodities = [];
  let commodityPrices = {}; // type string -> PriceQuote, from the latest MarketState
  let orderSizes = []; // units per order the server quotes (1, 2, 5, 10); T cycles through them
  let orderSizeIndex = 0;
  let lastReceipt = null; // { text, ok, until } for the latest TradeReceipt
  let tradeSequenceId = 0;
  let ClientMessage = null;
  let ServerMessage = null;
  let socket = null;

  const facingDirections = new Map();
  const lastPositions = new Map();

  // Cash is whole cents on the wire: 1011 -> "$10.11"
  function money(cents) {
    return "$" + (cents / 100).toFixed(2);
  }

  // "COMMODITY_WHEAT" -> "WHEAT", matching the label stations already render
  function commodityLabel(typeName) {
    return typeName.split("_")[1] || typeName;
  }

  // The proto sources import each other using paths relative to the protoc
  // -I root (e.g. "game/v1/common.proto"), and are served at those same
  // relative paths, so just resolve import targets as-is.
  const root = new protobuf.Root();
  root.resolvePath = (origin, target) => target;
  root.load(
    [
      "game/v1/common.proto",
      "game/v1/player.proto",
      "game/v1/client_message.proto",
      "game/v1/server_message.proto",
    ],
    (err) => {
      if (err) {
        statusDiv.innerText = "Error loading proto: " + err.message;
        return;
      }
      root.resolveAll();
      ClientMessage = root.lookupType("game.v1.ClientMessage");
      ServerMessage = root.lookupType("game.v1.ServerMessage");
      initNetwork();
    }
  );

  function initNetwork() {
    const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    socket = new WebSocket(`${proto}//${window.location.host}/ws`);
    socket.binaryType = "arraybuffer";

    socket.onopen = () => { statusDiv.innerText = "Status: Connected. Tracking local player."; };
    socket.onclose = () => { statusDiv.innerText = "Status: Disconnected. Server stopped."; };

    socket.onmessage = (event) => {
      try {
        const uint8Array = new Uint8Array(event.data);
        const decoded = ServerMessage.decode(uint8Array);
        const message = ServerMessage.toObject(decoded, { defaults: true, oneofs: true, longs: Number, enums: String });

        if (message.msg === "worldSnapshot") {
          handleWorldSnapshot(message.worldSnapshot);
        } else if (message.msg === "initialState") {
          stations = message.initialState.stationLayout || [];
        } else if (message.msg === "playerInventory") {
          myBalance = message.playerInventory.balance;
          myCommodities = (message.playerInventory.commodities || [])
            .slice()
            .sort((a, b) => a.type.localeCompare(b.type));
        } else if (message.msg === "marketState") {
          const quotes = message.marketState.quotes || [];
          for (const q of quotes) {
            commodityPrices[q.commodity] = q;
          }
          if (quotes.length > 0) orderSizes = (quotes[0].orders || []).map(o => o.units);
        } else if (message.msg === "trade") {
          handleTradeReceipt(message.trade);
        }
      } catch (e) {
        console.error("Failed to decode message:", e);
      }
    };

    function handleWorldSnapshot(snapshot) {
      const nextPlayers = snapshot.players || [];
      for (const p of nextPlayers) {
        const last = lastPositions.get(p.id);
        if (last) {
          p.vx = p.x - last.x;
          p.vy = p.y - last.y;
        } else {
          p.vx = 0;
          p.vy = 0;
        }
        lastPositions.set(p.id, { x: p.x, y: p.y });
      }

      players = nextPlayers;

      if (myPlayerId === null && players.length > 0) {
        myPlayerId = players[0].id;
      }
    }
  }

  const pressedKeys = new Set();
  const CONTROL_KEYS = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d", "W", "A", "S", "D"];

  function getLocalInputVector() {
    let vx = 0, vy = 0;
    if (pressedKeys.has("ArrowUp") || pressedKeys.has("w") || pressedKeys.has("W")) vy = -1;
    if (pressedKeys.has("ArrowDown") || pressedKeys.has("s") || pressedKeys.has("S")) vy = 1;
    if (pressedKeys.has("ArrowLeft") || pressedKeys.has("a") || pressedKeys.has("A")) vx = -1;
    if (pressedKeys.has("ArrowRight") || pressedKeys.has("d") || pressedKeys.has("D")) vx = 1;

    const length = Math.hypot(vx, vy);
    if (length > 1) {
      vx /= length;
      vy /= length;
    }
    return { vx, vy };
  }

  function sendInput() {
    if (!socket || socket.readyState !== WebSocket.OPEN || !ClientMessage) return;
    const { vx, vy } = getLocalInputVector();
    const payload = ClientMessage.encode({ input: { vx, vy } }).finish();
    socket.send(payload);
  }

  // Trading: E buys and Q sells exactly the selected order size at the nearby station, sending
  // the per-unit price shown on its label. The server fills the whole order at one price or
  // rejects it (not enough cash or units, or the price moved against us) with a TradeReceipt.
  const TRADE_RANGE = 5; // world.go TradeRange
  const INTENT_BUY = 1;
  const INTENT_SELL = 2;
  const RECEIPT_MS = 2500;
  const REJECTION_TEXT = {
    TRADE_REJECTION_NOT_AT_STATION: "Not at a trading station",
    TRADE_REJECTION_PRICE_MOVED: "Price moved, trade cancelled",
    TRADE_REJECTION_INSUFFICIENT_CASH: "Not enough cash",
    TRADE_REJECTION_INSUFFICIENT_UNITS: "Not enough units to sell",
    TRADE_REJECTION_POOL_EXHAUSTED: "Market can't fill that order",
  };

  function selectedUnits() {
    return orderSizes.length ? orderSizes[Math.min(orderSizeIndex, orderSizes.length - 1)] : 0;
  }

  // Per-unit buy/sell prices (cents) for an order of `units` of a commodity, or null
  function orderQuote(commodity, units) {
    const quote = commodityPrices[commodity];
    return quote ? (quote.orders || []).find(o => o.units === units) || null : null;
  }

  function nearbyStation(me) {
    let best = null, nearest = TRADE_RANGE;
    for (const s of stations) {
      const d = Math.hypot(s.x - me.x, s.y - me.y);
      if (d <= nearest) { nearest = d; best = s; }
    }
    return best;
  }

  function sendTrade(intent) {
    if (!socket || socket.readyState !== WebSocket.OPEN || !ClientMessage) return;
    const me = players.find(p => p.id === myPlayerId);
    if (!me) return;
    const station = nearbyStation(me);
    if (!station) return;
    const units = selectedUnits();
    const quote = orderQuote(station.commodity, units);
    const priceCents = quote ? (intent === INTENT_BUY ? quote.buyPriceCents : quote.sellPriceCents) : 0;
    if (!priceCents) return;

    tradeSequenceId += 1;
    const payload = ClientMessage.encode({
      trade: { sequenceId: tradeSequenceId, intent, units, priceCents },
    }).finish();
    socket.send(payload);
  }

  function handleTradeReceipt(r) {
    const text = r.success
      ? `${r.intent === "INTENT_BUY" ? "Bought" : "Sold"} ${r.unitsTransacted} ${commodityLabel(r.commodity)} @ ${money(r.priceCents)} = ${money(r.totalBalanceChange)}`
      : REJECTION_TEXT[r.rejection] || "Trade rejected";
    lastReceipt = { text, ok: r.success, until: performance.now() + RECEIPT_MS };
  }

  window.addEventListener("keydown", (e) => {
    if (e.key === "e" || e.key === "E") {
      e.preventDefault();
      sendTrade(INTENT_BUY);
      return;
    }
    if (e.key === "q" || e.key === "Q") {
      e.preventDefault();
      sendTrade(INTENT_SELL);
      return;
    }
    if (e.key === "t" || e.key === "T") {
      e.preventDefault();
      if (orderSizes.length) orderSizeIndex = (orderSizeIndex + 1) % orderSizes.length;
      return;
    }
    if (!CONTROL_KEYS.includes(e.key)) return;
    e.preventDefault();
    pressedKeys.add(e.key);
    sendInput();
  });

  window.addEventListener("keyup", (e) => {
    if (!pressedKeys.has(e.key)) return;
    pressedKeys.delete(e.key);
    sendInput();
  });

  function render(time) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#cbd5e1";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const me = players.find(p => p.id === myPlayerId) || players[0];

    if (me) {
      const playerPixelX = (me.x * TILE_SIZE) + (TILE_SIZE / 2);
      const playerPixelY = (me.y * TILE_SIZE) + (TILE_SIZE / 2);

      const cameraX = Math.floor(playerPixelX - (canvas.width / 2));
      const cameraY = Math.floor(playerPixelY - (canvas.height / 2));

      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      const startCol = Math.max(0, Math.floor(cameraX / VISUAL_TILE_SIZE));
      const endCol = Math.min(Math.ceil(WORLD_PIXEL_WIDTH / VISUAL_TILE_SIZE), Math.ceil((cameraX + canvas.width) / VISUAL_TILE_SIZE));
      const startRow = Math.max(0, Math.floor(cameraY / VISUAL_TILE_SIZE));
      const endRow = Math.min(Math.ceil(WORLD_PIXEL_WIDTH / VISUAL_TILE_SIZE), Math.ceil((cameraY + canvas.height) / VISUAL_TILE_SIZE));

      // 1. Draw Marble Tiles (44px each)
      for (let row = startRow; row < endRow; row++) {
        for (let col = startCol; col < endCol; col++) {
          const isEven = (row + col) % 2 === 0;
          ctx.fillStyle = isEven ? "#ffffff" : "#f1f5f9";
          ctx.fillRect(col * VISUAL_TILE_SIZE, row * VISUAL_TILE_SIZE, VISUAL_TILE_SIZE, VISUAL_TILE_SIZE);
        }
      }

      // 2. Draw Subtle Grout Lines
      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 1;
      for (let x = startCol * VISUAL_TILE_SIZE; x <= endCol * VISUAL_TILE_SIZE; x += VISUAL_TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, startRow * VISUAL_TILE_SIZE);
        ctx.lineTo(x, endRow * VISUAL_TILE_SIZE);
        ctx.stroke();
      }
      for (let y = startRow * VISUAL_TILE_SIZE; y <= endRow * VISUAL_TILE_SIZE; y += VISUAL_TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(startCol * VISUAL_TILE_SIZE, y);
        ctx.lineTo(endCol * VISUAL_TILE_SIZE, y);
        ctx.stroke();
      }

      // 3. Draw Trading Stations (blobs only, visuals TBD)
      for (const s of stations) {
        const sx = (s.x * TILE_SIZE) + (TILE_SIZE / 2);
        const sy = (s.y * TILE_SIZE) + (TILE_SIZE / 2);

        ctx.fillStyle = "#f59e0b";
        ctx.beginPath();
        ctx.arc(sx, sy, TILE_SIZE * 0.9, 0, Math.PI * 2);
        ctx.fill();

        // Per-unit prices for the selected order size: E buys that many, Q sells that many
        const units = selectedUnits();
        const quote = orderQuote(s.commodity, units);
        const stationLabel = quote && quote.buyPriceCents
          ? `${s.label} x${units} (E ${money(quote.buyPriceCents)} / Q ${money(quote.sellPriceCents)})`
          : s.label;

        ctx.font = "bold 10px monospace";
        ctx.textAlign = "center";
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(15, 23, 42, 0.85)";
        ctx.strokeText(stationLabel, sx, sy - (TILE_SIZE * 1.1));
        ctx.fillStyle = "#ffffff";
        ctx.fillText(stationLabel, sx, sy - (TILE_SIZE * 1.1));
      }

      // 4. Draw Players
      const localInput = getLocalInputVector();

      for (const p of players) {
        const px = (p.x * TILE_SIZE) + (TILE_SIZE / 2);
        const py = (p.y * TILE_SIZE) + (TILE_SIZE / 2);
        const isMe = p.id === myPlayerId;

        let vx = p.vx || 0;
        let vy = p.vy || 0;

        if (isMe) {
          vx = localInput.vx;
          vy = localInput.vy;
        }

        if (vx < -0.05) facingDirections.set(p.id, true);
        if (vx > 0.05) facingDirections.set(p.id, false);
        const facingLeft = facingDirections.get(p.id) || false;

        CrewmateRenderer.draw(ctx, {
          x: px,
          y: py,
          size: TILE_SIZE * 1.3,
          vx: vx,
          vy: vy,
          facingLeft: facingLeft,
          color: isMe ? 'green' : CrewmateRenderer.getColor(p.id || 0),
          isGhost: p.isGhost || false,
          time: time
        });

        // Player Label
        const label = isMe ? "You" : (p.name || `P${p.id}`);
        ctx.font = "bold 10px monospace";
        ctx.textAlign = "center";
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(15, 23, 42, 0.85)";
        ctx.strokeText(label, px, py - (TILE_SIZE * 0.7));
        ctx.fillStyle = "#ffffff";
        ctx.fillText(label, px, py - (TILE_SIZE * 0.7));
      }

      ctx.restore();

      // 5. HUD Overlay
      // Value is computed here from the latest MarketState quotes rather
      // than sent by the server, so there's one live source of truth for
      // price instead of a snapshot that could go stale as the market moves.
      // Value at the one-unit sell price, in cents.
      function commodityValue(c) {
        const quote = orderQuote(c.type, 1);
        return quote ? c.amount * quote.sellPriceCents : 0;
      }
      const portfolioValue = myCommodities.reduce((sum, c) => sum + commodityValue(c), 0);
      const hudLines = [
        `Pos: [${me.x.toFixed(1)}, ${me.y.toFixed(1)}]`,
        `Balance: ${myBalance === null ? "..." : money(myBalance)}`,
        `Portfolio: ${money(portfolioValue)}`,
        ...myCommodities.map(c => `${commodityLabel(c.type)}: ${c.amount} (${money(commodityValue(c))})`),
        "",
        `Order [T]: ${orderSizes.map((n, i) => i === orderSizeIndex ? `[${n}x]` : `${n}x`).join(" ")}`,
      ];
      const hudLineHeight = 18;
      const hudWidth = 230;
      const hudHeight = 12 + hudLines.length * hudLineHeight;

      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fillRect(16, 16, hudWidth, hudHeight);
      ctx.strokeStyle = "#475569";
      ctx.strokeRect(16, 16, hudWidth, hudHeight);
      ctx.fillStyle = "#38bdf8";
      ctx.font = "12px monospace";
      ctx.textAlign = "left";
      hudLines.forEach((line, i) => {
        ctx.fillText(line, 26, 35 + i * hudLineHeight);
      });

      // Latest trade result, centered near the bottom until it expires
      if (lastReceipt && performance.now() < lastReceipt.until) {
        ctx.font = "bold 14px monospace";
        ctx.textAlign = "center";
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(15, 23, 42, 0.9)";
        ctx.strokeText(lastReceipt.text, canvas.width / 2, canvas.height - 40);
        ctx.fillStyle = lastReceipt.ok ? "#86efac" : "#f87171";
        ctx.fillText(lastReceipt.text, canvas.width / 2, canvas.height - 40);
      }
    }

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
</script>
</body>
</html>
