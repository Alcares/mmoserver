<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid / Chessboard MMO</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/protobufjs/7.2.6/protobuf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #020617;
      color: #f8fafc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #status {
      margin-bottom: 12px;
      font-size: 14px;
    }
    canvas {
      border: 3px solid #475569;
      border-radius: 6px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      background: #000;
    }
  </style>
</head>
<body>
<div id="status">Status: Connecting...</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const statusDiv = document.getElementById("status");

  // Grid Configuration
  const TILE_SIZE = 50;
  const WORLD_TILES = 500; // 500x500 map

  let players = [];
  let myPlayerId = null;
  let InputCommand = null;
  let WorldSnapshot = null;
  let socket = null;

  protobuf.load("game.proto", (err, root) => {
    if (err) {
      statusDiv.innerText = "Error loading proto: " + err.message;
      return;
    }

    InputCommand = root.lookupType("game.v1.InputCommand");
    WorldSnapshot = root.lookupType("game.v1.WorldSnapshot");
    initNetwork();
  });

  function initNetwork() {
    const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    socket = new WebSocket(`${proto}//${window.location.host}/ws`);
    socket.binaryType = "arraybuffer";

    socket.onopen = () => {
      statusDiv.innerText = "Status: Connected. Tracking local player.";
    };

    socket.onclose = () => {
      statusDiv.innerText = "Status: Disconnected. Server stopped.";
    };

    socket.onmessage = (event) => {
      try {
        const uint8Array = new Uint8Array(event.data);
        const decoded = WorldSnapshot.decode(uint8Array);
        const message = WorldSnapshot.toObject(decoded, { defaults: true });
        players = message.players || [];

        // Identify local player: the server always includes 'self' first in per-client snapshots
        if (myPlayerId === null && players.length > 0) {
          myPlayerId = players[0].id;
        }
      } catch (e) {
        console.error("Failed to decode snapshot:", e);
      }
    };
  }

  // Capture key inputs
  window.addEventListener("keydown", (e) => {
    if (!socket || socket.readyState !== WebSocket.OPEN || !InputCommand) return;

    let dx = 0;
    let dy = 0;

    switch (e.key) {
      case "ArrowUp":
      case "w":
      case "W":
        dy = -1; break;
      case "ArrowDown":
      case "s":
      case "S":
        dy = 1; break;
      case "ArrowLeft":
      case "a":
      case "A":
        dx = -1; break;
      case "ArrowRight":
      case "d":
      case "D":
        dx = 1; break;
      default:
        return;
    }

    e.preventDefault();

    const payload = InputCommand.encode({ dx, dy }).finish();
    socket.send(payload);
  });

  // Render loop
  function render() {
    // Clear viewport
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#020617";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const me = players.find(p => p.id === myPlayerId) || players[0];

    if (me) {
      // Calculate Camera Offset (center player in the canvas)
      const playerPixelX = (me.x * TILE_SIZE) + (TILE_SIZE / 2);
      const playerPixelY = (me.y * TILE_SIZE) + (TILE_SIZE / 2);

      const cameraX = Math.floor(playerPixelX - (canvas.width / 2));
      const cameraY = Math.floor(playerPixelY - (canvas.height / 2));

      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      // Visible tile bounds (cull tiles outside current view)
      const startCol = Math.max(0, Math.floor(cameraX / TILE_SIZE));
      const endCol = Math.min(WORLD_TILES, Math.ceil((cameraX + canvas.width) / TILE_SIZE));
      const startRow = Math.max(0, Math.floor(cameraY / TILE_SIZE));
      const endRow = Math.min(WORLD_TILES, Math.ceil((cameraY + canvas.height) / TILE_SIZE));

      // 1. Draw Checkerboard Tiles within viewport
      for (let row = startRow; row < endRow; row++) {
        for (let col = startCol; col < endCol; col++) {
          const isEven = (row + col) % 2 === 0;
          ctx.fillStyle = isEven ? "#1e293b" : "#0f172a";
          ctx.fillRect(col * TILE_SIZE, row * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
      }

      // 2. Draw Grid Lines
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 1;
      for (let x = startCol * TILE_SIZE; x <= endCol * TILE_SIZE; x += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, startRow * TILE_SIZE);
        ctx.lineTo(x, endRow * TILE_SIZE);
        ctx.stroke();
      }
      for (let y = startRow * TILE_SIZE; y <= endRow * TILE_SIZE; y += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(startCol * TILE_SIZE, y);
        ctx.lineTo(endCol * TILE_SIZE, y);
        ctx.stroke();
      }

      // 3. Draw Players
      for (const p of players) {
        const px = (p.x * TILE_SIZE) + (TILE_SIZE / 2);
        const py = (p.y * TILE_SIZE) + (TILE_SIZE / 2);
        const isMe = p.id === myPlayerId;

        // Player Circle
        ctx.beginPath();
        ctx.arc(px, py, TILE_SIZE * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = isMe ? "#22c55e" : "#38bdf8"; // Green for self, blue for others
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#f8fafc";
        ctx.stroke();

        // Player Label
        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 11px monospace";
        ctx.textAlign = "center";
        const label = isMe ? `${p.name || `P${p.id}`} (You)` : (p.name || `P${p.id}`);
        ctx.fillText(label, px, py - (TILE_SIZE * 0.45));
      }

      ctx.restore();

      // UI Overlay: Coordinates readout
      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.fillRect(10, 10, 150, 26);
      ctx.strokeStyle = "#475569";
      ctx.strokeRect(10, 10, 150, 26);
      ctx.fillStyle = "#38bdf8";
      ctx.font = "12px monospace";
      ctx.textAlign = "left";
      ctx.fillText(`Pos: [${me.x}, ${me.y}]`, 18, 27);
    }

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
</script>
</body>
</html>
