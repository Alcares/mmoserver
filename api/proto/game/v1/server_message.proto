syntax = "proto3";

package game.v1;
option go_package = "github.com/alcares/mmoserver/gen/go/game/v1;gamev1";
option csharp_namespace = "Game.V1";

import "game/v1/common.proto";
import "game/v1/player.proto";

// Server -> Client: Where a power-up is spawned in the world
message PowerUp {
  uint32 id = 1;
  int32 x = 2;
  int32 y = 3;
  PowerUpType type = 4;
}

// Discrete event: A new power up appears on the floor
message PowerUpSpawned {
  PowerUp power_up = 1;
}

// Discrete event: Someone picked it up or it expired
message PowerUpDespawned {
  uint32 id = 1;
  uint32 collected_by_player_id = 2; // 0 if it simply timed out
}

// Server -> Client: Broadcasted every tick
message WorldSnapshot {
  uint64 tick = 1;
  repeated PlayerState players = 2;
}

message MarketState {
  uint64 tick = 1;
  repeated PriceQuote quotes = 2;
}

message PriceQuote {
  CommodityType commodity   = 1;
  int32  delta_basis_points = 2; // Shift of the one-unit buy price since last tick (+350 = +3.5%)
  // Total units left in the AMM pool (or total circulating units held by players)
  uint32 available_pool_units   = 3;
  // Optional: ID of the biggest bagholder in this pit for client visuals
  uint32 dominant_whale_id      = 4;
  // One quote per order size the server offers (1, 2, 5, 10 units), smallest first.
  // Clients offer exactly these sizes as their multipliers.
  repeated OrderQuote orders    = 5;
}

// Per-unit prices for an order of a given size. Every unit in an order trades at the same
// price, so the order's total is exactly units * price. Bigger orders move the pool further,
// so they buy higher and sell lower per unit.
message OrderQuote {
  uint32 units = 1;
  // Cents per unit to buy this many, rounded up; 0 if the pool can't sell this many
  uint64 buy_price_cents = 2;
  // Cents per unit received for selling this many, rounded down; 0 if worth under a cent each
  uint64 sell_price_cents = 3;
}

// Server -> Client: Answer to every TradeRequest, sent only to the trader
message TradeReceipt {
  uint32 sequence_id = 1;         // Matches incoming TradeRequest sequence_id
  bool success = 2;
  TradeRejection rejection = 3;   // Why it failed; UNSPECIFIED on success
  OrderIntent intent = 4;
  CommodityType commodity = 5;   // Unspecified if the player wasn't at a station

  uint64 total_balance_change = 6; // Cash spent or gained (cents): units_transacted * price_cents
  uint64 units_transacted = 7;    // Whole units bought or sold
  uint64 price_cents = 8;         // Execution price per unit

  uint64 new_cash_balance_cents = 9;
  uint64 new_holding_units = 10;
}


message TradingStation {
  CommodityType commodity = 1;
  float x = 2;
  float y = 3;
  string label = 4;
}

message InitialGameState {
  repeated TradingStation station_layout = 1;
}


// Server -> Client: Discriminated wrapper for all server messages.
// Add new server message types as new oneof members.
message ServerMessage {
  oneof msg {
    // Continuous streams
    WorldSnapshot world_snapshot = 1;
    MarketState market_state = 2;

    // Discrete events
    PowerUpSpawned power_up_spawned     = 3;
    PowerUpDespawned power_up_despawned = 4;

    // Initial join/reconnect
    InitialGameState initial_state      = 5;

    // Private inventory updates (sent only to owning player)
    TradeReceipt trade                  = 6;
    PlayerInventory player_inventory    = 7;
  }
}