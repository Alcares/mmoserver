syntax = "proto3";

package game.v1;
option go_package = "github.com/alcares/mmoserver/gen/go/game/v1;gamev1";
option csharp_namespace = "Game.V1";

enum PowerUpType {
  POWER_UP_TYPE_UNSPECIFIED = 0;
  POWER_UP_TYPE_FULL_VISION = 1;
}

enum CommodityType {
  COMMODITY_UNSPECIFIED = 0;
  COMMODITY_WHEAT = 1;
  COMMODITY_COFFEE = 2;
  COMMODITY_LITHIUM = 3;
  COMMODITY_GOLD = 5;
  COMMODITY_OIL = 6;
  COMMODITY_SILVER = 7;
}

enum OrderIntent {
  INTENT_UNSPECIFIED = 0;
  INTENT_ALLOCATE_FIXED = 1; // Buy: spend an exact amount of cash (cents)
  INTENT_ALLOCATE_RATIO = 2; // Spend e.g. 10%, 25%, 50%, 100% of wallet
  INTENT_SELL_RATIO     = 3; // Sell e.g. 25%, 50%, 100% of holdings
  INTENT_DUMP_ALL       = 4; // Complete liquidation
  INTENT_SELL_FIXED     = 5; // Sell an exact quantity of units (micro-units)
}

