syntax = "proto3";

package game.v1;
option go_package = "github.com/alcares/mmoserver/gen/go/game/v1;gamev1";
option csharp_namespace = "Game.V1";

import "game/v1/common.proto";

// Client -> Server: Sent whenever a key is pressed
message MovementCommand {
  float vx = 1;
  float vy = 2;
}

// Client -> Server: Sent when the player taps/holds the sell/buy button
message TradeRequest {
  uint32 sequence_id = 1;         // Client sequence counter for reconciliation
  OrderIntent intent = 2;

  oneof value {
    uint64 cash_amount = 3;       // Flat cash (e.g. $10.00 = 1000)
    uint32 basis_points = 4;      // Percentage of wallet (10000 = 100%, 2500 = 25%)
    uint64 unit_amount = 5;       // Units to sell, in micro-units (1000000 = one whole unit)
  }
}

// Client -> Server: Discriminated wrapper for all client commands.
message ClientMessage {
  oneof cmd {
    MovementCommand input = 1;
    TradeRequest trade = 2;
  }
}